name: ci

on:
  push:
    branches: [main]
    # 只改文档不必跑一遍测试与前端构建
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".gitignore"]
  pull_request:
  workflow_dispatch:

# 同一分支连续推两次只保留最后一次：旧的那次结果没人看
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 单测 / compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 纯 JUnit，不连 PG / Qdrant，所以这里不需要 service 容器。
      - name: Maven 单测
        run: mvn -B -ntp -f service/pom.xml test

      - name: 测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: service/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

      # compose 里的 ${VAR:?} 只有在变量缺失时才报错，本地起过一次就再也不会发现写错。
      - name: compose 变量与语法
        env:
          POSTGRES_PASSWORD: ci-placeholder
          QDRANT_API_KEY: ci-placeholder
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.build.yml config -q
          echo "compose OK"

  console:
    name: 控制台
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json

      # 锁文件只带生成时那一个平台的 rolldown/esbuild 二进制（npm/cli#4828），
      # runner 是 linux，这里丢掉锁现算一次，否则 ci 会装成功但 build 时缺 .node。
      - run: rm -f package-lock.json && npm install --no-audit --no-fund

      # vite build 只转译不做类型检查；类型错要到运行时才会炸，所以单列一步。
      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

      # 内网部署不能依赖 CDN。
      - name: 检查产物无外链
        run: |
          if grep -oE 'https?://[a-zA-Z0-9.-]+' dist/assets/*.js dist/assets/*.css dist/index.html \
              | grep -vE 'w3\.org|vuejs\.org|github\.com|naiveui\.com' | head -5 | grep .; then
            echo "产物里出现了外部地址，内网部署会 404"
            exit 1
          fi
          echo "产物无外链"

  plugin:
    name: 插件
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - run: npm ci --no-audit --no-fund 2>/dev/null || npm install --no-audit --no-fund

      - name: 打包
        run: npm run build

      # 假宿主冒烟：不依赖真实服务，验证挂载、写入、召回、工具与失败语义
      - name: 冒烟
        run: npm run smoke

  # 镜像由 docker.yml 在 main 与 tag 上构建并推送；这里只在 PR 上验
  # Dockerfile 还能不能出镜像，避免合并后才发现构建挂了。
  image:
    name: 镜像可构建
    if: github.event_name == 'pull_request'
    needs: [test, console]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 单测与前端构建刚跑过，这里只验 Dockerfile 能不能出镜像。
      - name: docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./service/Dockerfile
          push: false
          build-args: |
            MVN_TEST_FLAG=-DskipTests
            NPM_REGISTRY=https://registry.npmjs.org
          cache-from: type=gha
          cache-to: type=gha,mode=max
