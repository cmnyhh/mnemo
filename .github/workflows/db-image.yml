name: db-image

# 数据库镜像只随 db/ 目录变化而重建：里面是 PostgreSQL 18 + pg_textsearch，
# 与服务代码无关。以前它跟着每次发版一起编两遍多架构，纯属浪费。
on:
  push:
    branches: [main]
    paths: ["db/**"]
  workflow_dispatch:
    inputs:
      arm64:
        description: "同时构建 linux/arm64"
        type: boolean
        default: false

concurrency:
  group: db-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: 构建并推送
    if: github.repository == 'cmnyhh/mnemo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mnemo-db
    steps:
      - uses: actions/checkout@v4

      - name: 检查 Docker Hub 凭据
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error title=缺少 Docker Hub 凭据::配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
        if: github.event_name == 'workflow_dispatch' && inputs.arm64
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 平台
        id: plat
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.arm64 }}" = "true" ]; then
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ./db
          platforms: ${{ steps.plat.outputs.platforms }}
          push: true
          tags: |
            ${{ env.IMAGE }}:18
            ${{ env.IMAGE }}:18-${{ github.sha }}
          cache-from: type=gha,scope=db
          cache-to: type=gha,mode=max,scope=db
