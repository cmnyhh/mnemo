name: docker

# 只在「发版」时构建，不再跟着每次 push 跑。
#   v1.3.0 标签 → 1.3.0 / 1.3 / latest
#   手动触发   → edge（可选 arch）
#
# 只推 Docker Hub，不推 GHCR。多架构是这里最贵的一步：arm64 走 QEMU 模拟，
# Maven 编译在模拟层里跑，一份镜像要二十多分钟。默认只出 amd64——部署机是 x86，
# 需要 arm64（Mac 原生跑）时手动触发并勾上。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      edge:
        description: "推一个 edge 标签（日常预览用）"
        type: boolean
        default: true
      arm64:
        description: "同时构建 linux/arm64（QEMU 模拟，慢十几分钟）"
        type: boolean
        default: false

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: 构建并推送
    # 只在上游仓库跑：fork 里没有 secrets，也不该往别人的命名空间推。
    if: github.repository == 'cmnyhh/mnemo'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mnemo
    steps:
      - uses: actions/checkout@v4

      - name: 检查 Docker Hub 凭据
        id: hub
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error title=缺少 Docker Hub 凭据::配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 后再发版"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
        if: github.event_name == 'workflow_dispatch' && inputs.arm64
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 平台默认只看仓库变量，省得每次都点一次勾选
      - name: 计算平台
        id: plat
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.arm64 }}" = "true" ]; then
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      - name: 标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' && inputs.edge }}
            type=sha,prefix=sha-

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./service/Dockerfile
          platforms: ${{ steps.plat.outputs.platforms }}
          push: true
          build-args: |
            MVN_TEST_FLAG=-DskipTests
            NPM_REGISTRY=https://registry.npmjs.org
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 默认新建的 Hub 仓库是公开的；一旦被改成私有，外面就拉不动了，而推送本身不会报错。
      # 用匿名令牌取一次清单：拿不到 pull 权限就会是 401。
      - name: 校验可匿名拉取
        env:
          NS: ${{ secrets.DOCKERHUB_USERNAME }}
          TAG: ${{ steps.meta.outputs.version }}
        run: |
          tok=$(curl -fsS "https://auth.docker.io/token?service=registry.docker.io&scope=repository:$NS/mnemo:pull" \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["token"])')
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $tok" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://registry-1.docker.io/v2/$NS/mnemo/manifests/$TAG")
          echo "$NS/mnemo:$TAG 匿名拉取 → HTTP $code"
          [ "$code" = "200" ] || { echo "::error title=Hub 仓库不可匿名拉取::到 Docker Hub 把 $NS/mnemo 设为 Public"; exit 1; }

      # 推上去的仓库默认没有简介，Hub 页面上就是一片空白。失败不算发布失败。
      - name: 补齐仓库简介
        env:
          NS: ${{ secrets.DOCKERHUB_USERNAME }}
          U: ${{ secrets.DOCKERHUB_USERNAME }}
          P: ${{ secrets.DOCKERHUB_TOKEN }}
          DESC: "Self-hosted long-term memory for AI agents: hybrid retrieval, tiered recall, one console."
          FULL: |
            ## mnemo

            Self-hosted long-term memory for AI agents. PostgreSQL holds the record, Qdrant holds the vectors, and the two are rebuilt from the record whenever models change.

            ```bash
            git clone https://github.com/cmnyhh/mnemo.git && cd mnemo
            ./scripts/setup-env.sh
            docker compose up -d
            ```

            Documentation: https://github.com/cmnyhh/mnemo#readme
        run: |
          tok=$(curl -fsS -X POST https://hub.docker.com/v2/users/login \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$U\",\"password\":\"$P\"}" \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["token"])') || { echo "::warning::登录 Hub 失败，跳过简介"; exit 0; }
          body=$(jq -n --arg d "$DESC" --arg f "$FULL" '{description:$d, full_description:$f, is_private:false}')
          code=$(curl -s -o /tmp/hub.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $tok" -H 'Content-Type: application/json' \
            -d "$body" "https://hub.docker.com/v2/repositories/$NS/mnemo/")
          echo "$NS/mnemo 简介 → HTTP $code"
          [ "$code" = "200" ] || echo "::warning::$NS/mnemo 简介更新失败：$(head -c 200 /tmp/hub.json)"
